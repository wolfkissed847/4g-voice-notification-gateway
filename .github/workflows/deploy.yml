name: Build and Deploy on Pi

# รันบน self-hosted runner ที่ติดตั้งไว้บน Raspberry Pi เอง (ดู RUNNER_SETUP.md)
# ทุกครั้งที่ push เข้า main: Pi checkout โค้ดล่าสุด, build Docker image เอง (native build),
# แล้ว restart container ด้วย image ใหม่ทันที — ไม่มี cloud registry เกี่ยวข้องเลย
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # กดรันเองได้จากหน้า Actions ถ้าต้องการ

# push ติดๆ กันหลายครั้ง ให้ยกเลิกรอบเก่าที่ยังไม่เสร็จ แล้ว build เฉพาะ commit ล่าสุด
#
# ทำไมต้องมี: runner มีตัวเดียว (Pi) จึงทำได้ทีละ job ถ้า push 8 ครั้งใน 50 นาที
# Pi จะ build ครบทั้ง 8 รอบเรียงกันโดยไม่ได้พักเลย ทั้งที่ 7 รอบแรกเป็นโค้ดที่ถูกแทนที่ไปแล้ว
# ผลเสียคือ SD card ถูกเขียนหนัก (จุดที่พังบ่อยที่สุดของ Pi), CPU ร้อนต่อเนื่อง
# และ container ถูก restart ทุกรอบ = เว็บสะดุดครั้งละ 2-3 วิ ซ้ำๆ โดยไม่จำเป็น
concurrency:
  group: deploy-pi
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # ใช้แค่ label `self-hosted` (ทุก runner ได้ label นี้อัตโนมัติตอน config)
    # เดิมเขียน [self-hosted, raspberry-pi] แต่ตอนติดตั้ง runner จริงไม่ได้ใส่ label เพิ่ม
    # ผลคืองาน deploy จะค้างรอในคิวตลอดไปเพราะไม่มี runner ตัวไหนตรงเงื่อนไข
    # (โปรเจคนี้มี runner ตัวเดียวคือ Pi อยู่แล้ว จึงไม่ต้องแยก label)
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # ⚠️ clean: false สำคัญมาก ห้ามลบทิ้ง
          # ค่าเริ่มต้นของ actions/checkout คือ clean: true ซึ่งรัน `git clean -ffdx` ก่อน checkout
          # แฟลก -x หมายถึง "ลบไฟล์ที่อยู่ใน .gitignore ด้วย" — นั่นแปลว่าทุกครั้งที่ deploy
          # โฟลเดอร์ data/ (ฐานข้อมูล + ประวัติการโทรทั้งหมด) และไฟล์ .env จะถูกลบทิ้งเกลี้ยง
          clean: false

      - name: เตรียมโฟลเดอร์ข้อมูล + เช็คว่ามี .env
        run: |
          mkdir -p data/audio_cache data/logs
          # จำกัดสิทธิ์ทุกรอบ ไม่ใช่ตั้งครั้งเดียวตอนติดตั้ง — ในนี้มีเบอร์โทรของผู้รับแจ้งเตือน
          # (ข้อมูลส่วนบุคคล) กับ hash ของ API key ค่าเริ่มต้นของ SQLite คือ 644 = ทุก user
          # บนเครื่องอ่านไฟล์ได้ ถ้าตั้งครั้งเดียวแล้ววันหนึ่งไฟล์ถูกสร้างใหม่ (กู้ backup,
          # ลบ data/ ทิ้งแล้วให้ระบบสร้างเอง) สิทธิ์จะกลับไปหลวมเหมือนเดิมโดยไม่มีใครรู้
          chmod 700 data data/audio_cache data/logs
          chmod 600 data/gateway.db* 2>/dev/null || true
          if [ ! -f .env ]; then
            echo "::error::ไม่พบไฟล์ .env — ต้องสร้างครั้งเดียวบน Pi ที่ $(pwd)/.env (ก็อปจาก .env.example แล้วแก้ค่าจริง)"
            exit 1
          fi

      - name: Build image (native build บน Pi)
        # ส่ง commit hash เข้าไปใน image เพื่อให้หน้าเว็บบอกได้ว่ารันโค้ด commit ไหนอยู่
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker compose build

      - name: Restart container ด้วย image ใหม่
        run: docker compose up -d --force-recreate

      - name: ลบ image เก่าทิ้ง กัน SD card เต็ม
        run: docker image prune -f

      - name: เช็คว่า container รันขึ้นจริง
        run: |
          sleep 5
          docker compose ps
          curl -sf http://localhost:8000/health || (echo "Health check ล้มเหลว — ดู logs" && docker compose logs --tail=50 gateway && exit 1)
