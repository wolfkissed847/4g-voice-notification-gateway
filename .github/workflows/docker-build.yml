name: Build and Push Docker Image

# รันอัตโนมัติทุกครั้งที่ push เข้า main — build image แล้ว push ขึ้น GitHub Container Registry (GHCR)
# Pi 3 ไม่ต้อง build อะไรเลย แค่ pull image ที่ workflow นี้สร้างไว้ (ดู docker-compose.yml + Watchtower)
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # กดรันเองได้จากหน้า Actions ถ้าต้องการ

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (สำหรับ cross-compile ไป ARM)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push (multi-arch: arm/v7 สำหรับ Pi 3, arm64, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # arm/v7 = Raspberry Pi OS 32-bit บน Pi 3, arm64 = ถ้าใช้ 64-bit OS, amd64 = เผื่อ dev บนเครื่องทั่วไป
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
