# ===================================================================
# docker-compose.yml — รันบน Raspberry Pi 3 (build บนเครื่องนี้เอง)
#
# วิธีใช้ครั้งแรก:
#   1. cp .env.example .env แล้วแก้ค่าจริง
#   2. mkdir -p data/audio_cache data/logs && touch data/gateway.db
#   3. docker compose up -d --build
#
# หลังจากนั้น: แค่ push โค้ดขึ้น GitHub → self-hosted runner บน Pi นี้จะ
# checkout โค้ดใหม่ + build image + restart container ให้เองอัตโนมัติ
# (ดู .github/workflows/deploy.yml และ RUNNER_SETUP.md)
# ===================================================================

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: gateway-local:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # ข้อมูลที่ต้อง persist ข้าม container restart/rebuild
      - ./data/gateway.db:/app/gateway.db
      - ./data/audio_cache:/app/audio_cache
      - ./data/logs:/app/logs
    devices:
      # ให้ container มองเห็นโมดูล GSM ที่เสียบผ่าน USB บน Pi
      # เช็ค path จริงด้วย `ls /dev/ttyUSB*` บน Pi ก่อน แล้วแก้ให้ตรง
      - "/dev/ttyUSB2:/dev/ttyUSB2"
