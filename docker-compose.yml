# ===================================================================
# docker-compose.yml — รันบน Raspberry Pi 3 (build บนเครื่องนี้เอง)
#
# วิธีใช้ครั้งแรก:
#   1. cp .env.example .env แล้วแก้ค่าจริง (DATABASE_URL ต้องเป็น sqlite:////app/data/gateway.db)
#   2. mkdir -p data/audio_cache data/logs
#      (ไม่ต้อง touch data/gateway.db แล้ว — ตัวแอปจะสร้างไฟล์ + ตารางเองตอน start
#       ผ่าน init_db() ที่เรียก `alembic upgrade head` ดู app/database.py)
#   3. docker compose up -d --build
#
# หลังจากนั้น: แค่ push โค้ดขึ้น GitHub → self-hosted runner บน Pi นี้จะ
# checkout โค้ดใหม่ + build image + restart container ให้เองอัตโนมัติ
# (ดู .github/workflows/deploy.yml และ RUNNER_SETUP.md)
# ===================================================================

services:
  gateway:
    build:
      # รับจาก env ของ shell ที่สั่ง build — workflow ตั้ง GIT_SHA ให้ก่อนเรียก docker compose
      # build เองบนเครื่องโดยไม่ตั้งค่า จะได้ "dev" ซึ่งบอกได้ว่าไม่ได้มาจาก CI
      args:
        GIT_SHA: ${GIT_SHA:-dev}
      context: .
      dockerfile: Dockerfile
    image: gateway-local:latest
    container_name: gateway
    restart: unless-stopped

    # จำกัด RAM ไม่ให้ตัวเองลามไปกินจนเครื่องล่ม
    # Pi 3B มี RAM รวม ~905 MB ระบบนี้ใช้จริงราว 150-250 MB (FastAPI + worker + gTTS)
    # ให้เพดาน 600 MB = เผื่อไว้เท่าตัว แต่ยังเหลือ ~300 MB ให้ OS, cloudflared และ runner
    #
    # ที่ต้องมีเพราะถ้าวันหนึ่งมี memory leak หรือมีคนยิง API ถล่ม แล้วไม่มีเพดานไว้
    # Linux OOM killer จะเลือกฆ่า "โปรเซสที่กินเยอะที่สุด" ซึ่งอาจเป็น sshd หรือ Docker เอง
    # = เข้าเครื่องไม่ได้เลย ต้องไปถอดปลั๊ก มีเพดานแล้ว container นี้ตายคนเดียวแล้ว restart เอง
    mem_limit: 600m

    ports:
      # ผูกกับ 127.0.0.1 อย่างเดียว ไม่เปิดออกวง LAN
      #
      # ทางเข้าเดียวคือ Cloudflare Tunnel (cloudflared ใช้ network_mode: host จึงยิงเข้า
      # localhost:8000 ได้ตรงๆ) ซึ่งมี WAF/rate limit ของ Cloudflare คั่นอยู่ข้างหน้า
      # ต่างจากพอร์ตที่เปิดโล่งในวง LAN ที่ทุกอุปกรณ์ในบ้าน/ออฟฟิศยิงถึงได้โดยไม่มีอะไรกรอง
      #
      # ถ้าต้องการเข้าจาก LAN ตรงๆ (เช่น tunnel ล่ม) เปลี่ยนกลับเป็น "8000:8000"
      # หรือทำ SSH tunnel ชั่วคราว: ssh -L 8000:localhost:8000 user@<ip-ของ-pi>
      - "127.0.0.1:8000:8000"
    env_file:
      - .env

    environment:
      # ── บังคับ path ฐานข้อมูลตรงนี้ ห้ามปล่อยให้ .env เป็นคนกำหนด ────────────
      # environment ทับค่าจาก env_file เสมอ จึงกันพลาดได้แน่นอนกว่าการหวังให้คนแก้ .env ถูก
      #
      # ที่ต้องบังคับเพราะ .env.example ตั้ง default ไว้เป็น sqlite:///./gateway.db
      # ซึ่งเป็น path แบบ relative → ชี้ไปที่ /app/gateway.db "ในตัว container"
      # ไม่ใช่ /app/data ที่เมานต์กับดิสก์ของ Pi ผลคือ **ฐานข้อมูลหายทั้งก้อนทุกครั้งที่ deploy**
      # (docker compose up -d จะสร้าง container ใหม่ ไฟล์ที่ไม่ได้อยู่บน volume หายไปกับตัวเก่า)
      # เจอจริงตอน deploy รอบแรกบน Pi — ประวัติการโทรกับ API key ที่สร้างไว้หายเกลี้ยง
      #
      # 4 slash = absolute path (sqlite:// + /app/data/gateway.db)
      - DATABASE_URL=sqlite:////app/data/gateway.db

    volumes:
      # ข้อมูลที่ต้อง persist ข้าม container restart/rebuild
      #
      # DB เมานต์เป็น "โฟลเดอร์" ไม่ใช่ไฟล์เดียว (ตั้ง DATABASE_URL=sqlite:////app/data/gateway.db ใน .env)
      # เพราะ SQLite โหมด WAL สร้างไฟล์พ่วงอีก 2 ตัวคือ gateway.db-wal และ gateway.db-shm
      # ถ้าเมานต์เฉพาะไฟล์ gateway.db ไฟล์พ่วงจะไปเกิดในชั้น filesystem ของ container
      # แล้วหายทุกครั้งที่ recreate = transaction ที่ commit แล้วแต่ยังไม่ checkpoint หายไปด้วย
      # เมานต์เป็นโฟลเดอร์ทำให้ทั้ง 3 ไฟล์อยู่บน host ด้วยกัน และรองรับการสร้างไฟล์ใหม่ (VACUUM INTO/restore)
      - ./data:/app/data
      - ./data/audio_cache:/app/audio_cache
      - ./data/logs:/app/logs
      # โมดูล GSM — เมานต์ /dev ทั้งก้อนแทนการผูก node ตายตัว (ดูเหตุผลใต้บล็อกนี้)
      - /dev:/dev
    # ── การเข้าถึงโมดูล GSM ที่เสียบผ่าน USB ──────────────────────────────────
    #
    # เดิมใช้ `devices: - "/dev/ttyUSB2:/dev/ttyUSB2"` ซึ่งมีปัญหาใหญ่ 2 ข้อ:
    #
    # 1) Docker ถือว่า devices เป็น "เงื่อนไขบังคับตอนสตาร์ต" ถ้าไฟล์นั้นไม่มีอยู่
    #    มันจะไม่ยอมสตาร์ต container เลย ไม่ใช่แค่ปิดความสามารถในการโทร
    #    ผลคือถอดโมดูลออกแล้ว Pi รีบูต (หรือ deploy ใหม่) = เว็บ, API, ฐานข้อมูล
    #    ล่มทั้งหมดตามไปด้วย ทั้งที่ทั้งสามอย่างไม่ได้เกี่ยวกับโมดูลเลย
    #    ย้อนแย้งที่สุดคือหน้าเว็บคือที่ที่ผู้ดูแลจะเข้าไปดูว่า "โมดูลเป็นอะไร"
    #
    # 2) devices ผูกกันที่ major:minor ตอนสตาร์ต ถอดเสียบใหม่แล้วเคอร์เนลให้เลขใหม่
    #    node ที่อยู่ใน container จะกลายเป็นของตายที่ชี้ไปยังอุปกรณ์ที่ไม่มีอยู่แล้ว
    #
    # เมานต์ /dev เข้าไปแทน node ใหม่ที่โผล่บนเครื่องแม่จึงปรากฏใน container ทันที
    # ถอดเสียบได้โดยไม่ต้อง restart และ container สตาร์ตได้เสมอแม้ยังไม่ได้เสียบโมดูล
    #
    # ⚠️ ข้อแลกเปลี่ยน: container จะ "เห็นชื่อ" ไฟล์อุปกรณ์อื่นในเครื่องด้วย
    # แต่ "เข้าถึงจริง" ได้เฉพาะที่ device_cgroup_rules อนุญาต ซึ่งจำกัดไว้ที่ major 188
    # (usbserial) เท่านั้น อุปกรณ์อื่นอย่างดิสก์หรือกล้องยังถูกเคอร์เนลปฏิเสธเหมือนเดิม
    device_cgroup_rules:
      - "c 188:* rmw"   # 188 = usbserial (ttyUSB*) — อนุญาตเฉพาะกลุ่มนี้กลุ่มเดียว
    logging:
      # ค่าเริ่มต้นของ Docker คือเก็บ log ไว้ "ไม่จำกัดขนาด" — ระบบนี้รันทิ้งไว้ตลอด 24 ชม.
      # บน SD card ที่พื้นที่จำกัดและเขียนซ้ำมากๆ แล้วเสียง่าย ถ้าไม่จำกัดไว้ วันหนึ่ง log
      # จะกินพื้นที่จนเขียน DB ไม่ได้ แล้วระบบจะหยุดแจ้งเตือนโดยไม่มีสัญญาณเตือนล่วงหน้า
      # 10MB x 3 ไฟล์ = ใช้พื้นที่ไม่เกิน 30MB เสมอ และยังเหลือ log ย้อนหลังพอให้ดีบักได้
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
